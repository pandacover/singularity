[project]
name = "singularity"
version = "0.1.0"
description = "Procedural memory graphs for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/singularity"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
