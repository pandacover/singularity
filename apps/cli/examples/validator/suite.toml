# A second repository: validator.js (string validators, JavaScript, mocha),
# cloned from https://github.com/validatorjs/validator.js next to the
# excalidraw clone. One family, "add to the validators", from the repo's own
# history: each task is a real upstream change, asked at its parent commit,
# and checked by that change's own tests (test/validators.test.js at the
# change, copied over the agent's after it finishes).
#
# - aba-routing, iso31661-numeric: seeds, memory learns from their runs.
#   A new validator: its file in src/lib, its import and export in
#   src/index.js, a row in the README's table, tests.
# - ulid: held out, the same kind (a new validator) with other logic.
# - postal-code-pk: held out, a variant: a locale added to an existing
#   validator (its map in src/lib, the README's locale list, tests), with no
#   new file and no export.
#
# Checks are scoped: the build (the tests read the browser build), the linter
# (as the repo's own `npm test` runs it), and the validators' tests (well
# under a second). The 2024 toolchain needs --legacy-peer-deps with npm 11.
name = "validator"
repo = "../../../../../experiment/validator.js"
setup = ["npm install --no-audit --no-fund --loglevel=error --legacy-peer-deps --prefer-offline"]
keep = ["node_modules"]
command_timeout_s = 600

[agent]
model = "sonnet"
effort = "medium"
max_budget_usd = 3.0
timeout_s = 1800

[[tasks]]
id = "aba-routing"
family = "new-validator"
base = "32b174e"
prompt = """
Add a validator `isAbaRouting(str)` that checks whether a string is an ABA
routing number for a US bank account or cheque: exactly 9 digits; the first
two digits must be 00-12, 21-32, 61-72 or 80 (other prefixes are reserved);
and 3 x (d1 + d4 + d7) + 7 x (d2 + d5 + d8) + (d3 + d6 + d9) must be a
multiple of 10. Export it as `validator.isAbaRouting`, list it in the
README's table of validators, add tests, and make sure the tests and the
linter pass.
"""
checks = [
  "npm run build",
  "npx eslint src test",
  "npx mocha --require @babel/register --reporter dot test/validators.test.js",
]
check_files = "hidden/aba-routing"

[[tasks]]
id = "iso31661-numeric"
family = "new-validator"
base = "cd4e7bf"
prompt = """
Add a validator `isISO31661Numeric(str)` that checks whether a string is an
officially assigned ISO 3166-1 numeric country code: three digits, such as
`840` for the United States or `076` for Brazil. Withdrawn and unassigned
codes are not valid. Export it as `validator.isISO31661Numeric`, list it in
the README's table of validators, add tests, and make sure the tests and the
linter pass.
"""
checks = [
  "npm run build",
  "npx eslint src test",
  "npx mocha --require @babel/register --reporter dot test/validators.test.js",
]
check_files = "hidden/iso31661-numeric"

[[tasks]]
id = "ulid"
family = "new-validator"
base = "89e856c"
prompt = """
Add a validator `isULID(str)` that checks whether a string is a ULID: 26
characters of Crockford's base32 alphabet (the digits and the letters A-Z
except I, L, O and U), in either case, whose first character is 0-7. Export
it as `validator.isULID`, list it in the README's table of validators, add
tests, and make sure the tests and the linter pass.
"""
checks = [
  "npm run build",
  "npx eslint src test",
  "npx mocha --require @babel/register --reporter dot test/validators.test.js",
]
check_files = "hidden/ulid"

[[tasks]]
id = "postal-code-pk"
family = "new-locale"
base = "991e5ac"
prompt = """
Add Pakistan (`PK`) to `isPostalCode`: Pakistani postal codes are five
digits, such as `44000`. Update the README where `isPostalCode`'s locales
are listed, add tests, and make sure the tests and the linter pass.
"""
checks = [
  "npm run build",
  "npx eslint src test",
  "npx mocha --require @babel/register --reporter dot test/validators.test.js",
]
check_files = "hidden/postal-code-pk"
