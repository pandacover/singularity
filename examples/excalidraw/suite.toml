# --- Family: new appState field -----------------------------------------------
# Touches the AppState type, the defaults, the storage config, and six
# snapshot files that dump the whole appState. Restore needs no change except
# for the validation in the export-padding variant.

[[tasks]]
id = "appstate-minimap"
family = "appstate-field"
prompt = """
Add a new boolean appState field `minimapEnabled`, default false. Nothing uses
it yet; it's for an upcoming minimap feature. It should be saved to the
browser's local storage, but not included in exported files or sent to the
collaboration server. Make sure the tests and the typecheck pass.
"""
checks = ['yarn vitest run --exclude "**/MermaidToExcalidraw.test.tsx"', "yarn tsc"]
check_files = "hidden/appstate-minimap"

[[tasks]]
id = "appstate-presenter"
family = "appstate-field"
prompt = """
Add a new boolean appState field `presenterMode`, default false. Nothing uses
it yet; it's for an upcoming presenter feature. It's session-only: don't save
it to local storage, exported files, or the collaboration server. Make sure the
tests and the typecheck pass.
"""
checks = ['yarn vitest run --exclude "**/MermaidToExcalidraw.test.tsx"', "yarn tsc"]
check_files = "hidden/appstate-presenter"

[[tasks]]
id = "appstate-export-padding"
family = "appstate-field"
prompt = """
Add a new numeric appState field `exportPadding`, default 10, for the padding
around exported images (nothing uses it yet). It should be saved to the
browser's local storage and included in exported files, but not sent to the
collaboration server. When a scene is restored, an exportPadding that isn't a
non-negative number should fall back to the default. Make sure the tests and
the typecheck pass.
"""
checks = ['yarn vitest run --exclude "**/MermaidToExcalidraw.test.tsx"', "yarn tsc"]
check_files = "hidden/appstate-export-padding"
