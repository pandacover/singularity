# The evaluation suite: three task families against the user's excalidraw
# clone, at the last upstream commit before their own `procedural/` notes.
#
# Each family has a seed task (the one memory is built from and that is later
# repeated exactly) and two similar-but-different variants. Every task's hidden
# test is copied in as packages/excalidraw/tests/hidden-check.test.tsx after the
# agent finishes. Success means the whole test suite (which picks up the hidden
# test) and the typecheck pass, so a change that breaks other tests or leaves
# stale snapshots fails. MermaidToExcalidraw.test.tsx is excluded: its snapshot
# depends on timing, and `yarn test:update` (which the repo's CLAUDE.md asks
# agents to run) sometimes records a transient error state into it.
#
# Reference timings on this machine: first `yarn install` 2m44s (once per
# workspace, node_modules is kept), full test suite 101 s, tsc 19 s.
name = "excalidraw"
repo = "../../../experiment/excalidraw"
base = "84e3f5a4"
setup = ["yarn install --frozen-lockfile --prefer-offline"]
keep = ["node_modules"]
command_timeout_s = 900

[agent]
model = "sonnet"
effort = "medium"
max_budget_usd = 3.0
timeout_s = 1800

# --- Family: tool letter shortcuts -------------------------------------------
# Touches the key constants, the tool table, the help dialog, and tests that
# press the old key (plus a regression snapshot named after it).

[[tasks]]
id = "shortcut-rectangle-m"
family = "tool-shortcut"
prompt = """
Change the keyboard shortcut for the rectangle tool from R to M. The number
shortcut (2) should keep working. Update everything that shows or tests the
shortcut, and make sure the tests and the typecheck pass.
"""
checks = ['yarn vitest run --exclude "**/MermaidToExcalidraw.test.tsx"', "yarn tsc"]
check_files = "hidden/shortcut-rectangle-m"

[[tasks]]
id = "shortcut-diamond-j"
family = "tool-shortcut"
prompt = """
Change the keyboard shortcut for the diamond tool from D to J. The number
shortcut (3) should keep working. Update everything that shows or tests the
shortcut, and make sure the tests and the typecheck pass.
"""
checks = ['yarn vitest run --exclude "**/MermaidToExcalidraw.test.tsx"', "yarn tsc"]
check_files = "hidden/shortcut-diamond-j"

[[tasks]]
id = "shortcut-ellipse-u"
family = "tool-shortcut"
prompt = """
Change the keyboard shortcut for the ellipse tool from O to U. The number
shortcut (4) should keep working. Update everything that shows or tests the
shortcut, and make sure the tests and the typecheck pass.
"""
checks = ['yarn vitest run --exclude "**/MermaidToExcalidraw.test.tsx"', "yarn tsc"]
check_files = "hidden/shortcut-ellipse-u"

# --- Family: Alt+letter action shortcuts --------------------------------------
